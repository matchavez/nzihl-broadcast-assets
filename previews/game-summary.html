<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NZIHL Live Game Summary — mock v6</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  :root{ --bg:#111111; --line:#2a2f3a; --line2:#20242e;
    --fg:#f4f6fa; --sub:#c3c9d4; --dim:#878d99; --gold:#FFCF49; --redA:#b42026; --redB:#7c1014; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;font-family:Inter,-apple-system,Segoe UI,sans-serif;
    font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased;}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{width:1840px;height:1000px;flex:0 0 auto;position:relative;color:var(--fg);
    background:var(--bg);overflow:hidden;display:flex;flex-direction:column;}

  /* hazy angled team-colour wash behind the teams */
  #wash{position:absolute;left:0;top:0;width:100%;height:230px;z-index:0;pointer-events:none;filter:blur(48px);opacity:.6;}
  .livedot{position:absolute;top:16px;left:22px;z-index:6;width:14px;height:14px;border-radius:50%;
    background:#5fe39a;box-shadow:0 0 0 0 rgba(95,227,154,.6);animation:pl 2.2s ease-out infinite;}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(95,227,154,.55)}70%{box-shadow:0 0 0 11px rgba(95,227,154,0)}100%{box-shadow:0 0 0 0 rgba(95,227,154,0)}}

  header{height:188px;flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 60px;position:relative;z-index:1;}
  .side{display:flex;align-items:center;gap:26px;}
  .side.home{flex-direction:row-reverse;text-align:right;}
  .side .logo{width:120px;height:120px;object-fit:contain;flex:0 0 auto;}
  .nm{font-weight:800;font-size:40px;line-height:1.02;}
  .rec{font-weight:600;font-size:24px;color:var(--sub);margin-top:9px;letter-spacing:.01em;}
  .rec b{color:var(--fg);font-weight:800;}
  .score{font-weight:900;font-size:112px;line-height:.86;flex:0 0 auto;}
  .center{text-align:center;min-width:330px;padding:0 22px;}
  .status{font-weight:600;font-size:26px;letter-spacing:.01em;color:var(--gold);}
  .date{font-weight:700;font-size:18px;color:var(--sub);margin-top:4px;}
  .pg{margin:11px auto 0;border-collapse:collapse;}
  .pg th{color:var(--dim);font-weight:800;font-size:15px;letter-spacing:.05em;padding:2px 17px;}
  .pg td{font-weight:800;font-size:28px;color:var(--fg);padding:2px 17px;text-align:center;}
  .pg td.lbl{text-align:left;font-size:20px;color:var(--sub);}
  .pg td.tot{color:var(--gold);font-size:31px;}
  .pg .chip{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:8px;vertical-align:-1px;}

  .divider{height:42px;flex:0 0 auto;position:relative;z-index:1;background:linear-gradient(90deg,var(--redA),var(--redB));
    display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;
    font-weight:800;font-size:18px;letter-spacing:.1em;text-transform:uppercase;}
  .divider .sep{color:#ffffff7a;font-weight:700;margin:0 4px;}

  #grid{flex:1 1 auto;min-height:0;display:grid;gap:0;position:relative;z-index:1;}
  .col{min-width:0;height:100%;overflow:hidden;padding:16px 26px 8px;border-right:1px solid var(--line2);}
  .col:last-child{border-right:0;}
  .col h2{font-size:.62em;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--sub);
    margin-bottom:.5em;text-align:center;white-space:nowrap;}
  .col.penalties h2{color:#e7b3b8;}

  .goal{display:flex;align-items:center;gap:.5em;padding:.4em 0;border-bottom:1px solid var(--line2);}
  .goal:last-child{border-bottom:0;}
  .accent{flex:0 0 .2em;align-self:stretch;border-radius:.12em;min-width:4px;}
  .shot{flex:0 0 auto;width:2.6em;height:2.6em;max-width:74px;max-height:74px;border-radius:50%;overflow:hidden;background:#1b2029;
    display:flex;align-items:center;justify-content:center;}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;}
  .shot .ini{font-weight:800;font-size:.82em;color:#aeb6c2;}
  .gmain{flex:1 1 auto;min-width:0;}
  .gname{font-weight:800;font-size:1.0em;line-height:1.08;white-space:nowrap;}
  .gname .no{color:var(--dim);font-weight:700;margin-right:.28em;}
  .gsub{display:flex;align-items:baseline;gap:.55em;margin-top:.12em;white-space:nowrap;}
  .gast{flex:1 1 auto;min-width:0;overflow:hidden;font-size:.62em;color:var(--dim);}
  .gtag{flex:0 0 auto;font-weight:800;font-size:.5em;padding:.16em .5em;border-radius:.4em;letter-spacing:.04em;
    background:#33271a;color:#ffce7d;}
  .gtime{flex:0 0 auto;font-weight:800;font-size:.64em;color:var(--sub);}

  .pen{display:flex;align-items:center;gap:.5em;padding:.36em 0;border-bottom:1px solid var(--line2);}
  .pen:last-child{border-bottom:0;}
  .pwho{flex:1 1 auto;min-width:0;}
  .pname{font-weight:700;font-size:.9em;line-height:1.08;white-space:nowrap;}
  .pname .no{color:var(--dim);font-weight:700;margin-right:.24em;}
  .psub{display:flex;align-items:baseline;gap:.5em;margin-top:.1em;white-space:nowrap;}
  .pinf{flex:1 1 auto;min-width:0;overflow:hidden;font-size:.58em;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
  .ppim{flex:0 0 auto;font-weight:700;font-size:.55em;color:#d7adb1;}
  .ptime{flex:0 0 auto;font-weight:800;font-size:.62em;color:var(--sub);}
  .psubhd{font-size:.55em;font-weight:800;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:.6em 0 .25em;text-align:center;}
  .psubhd:first-child{margin-top:0;}

  #sim{position:fixed;left:12px;bottom:12px;display:flex;gap:14px;z-index:9;align-items:center;}
  #sim .grp{display:flex;gap:6px;align-items:center;}
  #sim b{color:#6b7280;font:600 11px Inter,sans-serif;}
  #sim button{font:600 12px Inter,sans-serif;color:#cfd5df;background:#171b22;border:1px solid #2c323d;border-radius:7px;padding:6px 11px;cursor:pointer;}
  #sim button.on{background:#FFCF49;color:#1a1500;border-color:#FFCF49;}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="wash"></div>
  <span class="livedot"></span>
  <header>
    <div class="side away">
      <img class="logo" id="logoA" alt="">
      <div><div class="nm" id="nameA"></div><div class="rec" id="recA"></div></div>
      <div class="score" id="sA"></div>
    </div>
    <div class="center">
      <div class="status" id="status"></div>
      <div class="date" id="date"></div>
      <table class="pg" id="pgrid"></table>
    </div>
    <div class="side home">
      <img class="logo" id="logoB" alt="">
      <div><div class="nm" id="nameB"></div><div class="rec" id="recB"></div></div>
      <div class="score" id="sB"></div>
    </div>
  </header>
  <div class="divider" id="divider"></div>
  <div id="grid"></div>
</div></div>

<div id="sim">
  <div class="grp"><b>GAME</b><button data-g="low">Low 4–1</button><button data-g="high">High 13–12</button></div>
  <div class="grp"><b>STATE</b><button data-p="1">1st</button><button data-p="2">2nd</button><button data-p="3">3rd / Final</button></div>
</div>

<script>
const SHOT="https://www.nzihl.com/media/leagues/6795/graphics/";
const TEAM={ DUN:{ink:"#1E9E63"}, SCS:{ink:"#FAC805"}, ADM:{ink:"#F7BE11"}, CRD:{ink:"#E5242B"} };
const PERIOD_DEFS=[{k:"1",label:"1st Period"},{k:"2",label:"2nd Period"},{k:"3",label:"3rd Period"}];
const LEAGUE="New Zealand Ice Hockey League";

const GAMES={
 high:{
  away:{code:"DUN",name:"Dunedin Thunder",logo:"thunder.png",sog:24,pp:"2/6",pim:12,line:[3,1,0]},
  home:{code:"SCS",name:"SkyCity Stampede",logo:"stampede.png",sog:44,pp:"0/6",pim:12,line:[0,6,3]},
  date:"Fri 19 Jun 2026 · 7:00 PM", venue:"Queenstown Ice Arena",
  goals:[
   {p:"1",t:"16:39",team:"DUN",no:72,who:"Samuel Loiselle",a:"Stegmann, Audas",tag:"PP"},
   {p:"1",t:"15:00",team:"DUN",no:24,who:"Jack Lewis",a:"Eaden, Loiselle",tag:"PP"},
   {p:"1",t:"12:17",team:"DUN",no:93,who:"Luke Stegmann",a:"Beckstead, Audas",tag:""},
   {p:"2",t:"18:58",team:"SCS",no:11,who:"Conner Jean",a:"Frear, Devlin",tag:""},
   {p:"2",t:"16:20",team:"SCS",no:11,who:"Conner Jean",a:"Devlin, Frear",tag:""},
   {p:"2",t:"13:06",team:"SCS",no:24,who:"Lachlan Frear",a:"Roth, Jean",tag:""},
   {p:"2",t:"7:41",team:"SCS",no:21,who:"Dylan Devlin",a:"Unassisted",tag:""},
   {p:"2",t:"6:50",team:"SCS",no:55,who:"Max Roth",a:"Frear",tag:""},
   {p:"2",t:"4:22",team:"SCS",no:11,who:"Conner Jean",a:"Devlin, Roth",tag:""},
   {p:"2",t:"2:42",team:"DUN",no:24,who:"Jack Lewis",a:"Audas, Orr",tag:""},
   {p:"3",t:"19:28",team:"SCS",no:9,who:"Axel Ruski-Jones",a:"Amston, Flight",tag:"SH"},
   {p:"3",t:"15:35",team:"SCS",no:24,who:"Lachlan Frear",a:"Devlin, Jean",tag:""},
   {p:"3",t:"6:57",team:"SCS",no:21,who:"Dylan Devlin",a:"Frear, Jean",tag:""},
  ],
  pens:[
   {p:"1",t:"17:25",team:"SCS",no:28,who:"Jake Hutchins",inf:"Delay of game",dur:"2:00"},
   {p:"1",t:"16:47",team:"SCS",no:25,who:"Maxwell Macharg",inf:"Interference",dur:"2:00"},
   {p:"1",t:"14:31",team:"DUN",no:6,who:"Austin Goh",inf:"Slashing",dur:"2:00"},
   {p:"1",t:"10:38",team:"SCS",no:21,who:"Dylan Devlin",inf:"Tripping",dur:"2:00"},
   {p:"1",t:"8:48",team:"SCS",no:8,who:"Connor Harrison",inf:"High-sticking",dur:"2:00"},
   {p:"1",t:"5:51",team:"DUN",no:91,who:"Morgan Blair",inf:"Roughing",dur:"2:00"},
   {p:"1",t:"1:28",team:"DUN",no:7,who:"William Bary",inf:"Hooking",dur:"2:00"},
   {p:"2",t:"9:44",team:"DUN",no:24,who:"Jack Lewis",inf:"Roughing",dur:"2:00"},
   {p:"2",t:"6:50",team:"DUN",no:72,who:"Samuel Loiselle",inf:"Cross-checking",dur:"2:00"},
   {p:"2",t:"0:22",team:"SCS",no:21,who:"Dylan Devlin",inf:"Holding",dur:"2:00"},
   {p:"3",t:"11:39",team:"SCS",no:3,who:"Stefan Amston",inf:"Hooking",dur:"2:00"},
   {p:"3",t:"4:21",team:"DUN",no:0,who:"James Moore",inf:"Interference",dur:"2:00"},
  ]},
 low:{
  away:{code:"ADM",name:"Pure NZ Admirals",logo:"PureNZAdmirals2000x2000.jpg",sog:38,pp:"1/2",pim:4,line:[1,1,2]},
  home:{code:"CRD",name:"Canterbury Red Devils",logo:"reddevils.png",sog:30,pp:"1/2",pim:6,line:[1,0,0]},
  date:"Sat 6 Jun 2026 · 5:10 PM", venue:"Alpine Ice, Christchurch",
  goals:[
   {p:"1",t:"17:16",team:"ADM",no:26,who:"Benjamin De Jonge",a:"Vadim Sevenier",tag:""},
   {p:"1",t:"3:12",team:"CRD",no:21,who:"Michael Morrissey",a:"Alex Gagnon",tag:"PP"},
   {p:"2",t:"12:55",team:"ADM",no:39,who:"Vadim Sevenier",a:"Benjamin De Jonge, Alexander Regan",tag:""},
   {p:"3",t:"14:50",team:"ADM",no:28,who:"Scott Henry",a:"Unassisted",tag:""},
   {p:"3",t:"1:02",team:"ADM",no:23,who:"Benjamin Stephen",a:"Stephen Mawson, Roscoe Eade",tag:"PP"},
  ],
  pens:[
   {p:"1",t:"12:58",team:"CRD",no:95,who:"Caleb Hance",inf:"Hooking",dur:"Pen. shot"},
   {p:"1",t:"3:19",team:"ADM",no:23,who:"Benjamin Stephen",inf:"Hooking",dur:"2:00"},
   {p:"1",t:"2:19",team:"CRD",no:22,who:"Luke Tappin",inf:"Slashing",dur:"2:00"},
   {p:"3",t:"4:34",team:"CRD",no:22,who:"Luke Tappin",inf:"Roughing",dur:"2:00"},
   {p:"3",t:"4:34",team:"ADM",no:42,who:"Alexander Regan",inf:"Roughing",dur:"2:00"},
   {p:"3",t:"2:31",team:"CRD",no:13,who:"Jaan Turia",inf:"Slashing",dur:"2:00"},
  ]}
};

let CUR={g:"low",p:3};
const ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const shotURL=n=>SHOT+encodeURIComponent(n.replace(/\s+/g,""))+".jpg";
const nameInit=n=>{const x=n.split(/\s+/);return x.length<2?n:x[0][0]+". "+x.slice(1).join(" ");};
const sum=a=>a.reduce((x,y)=>x+y,0);

function positionWash(g){
  const wash=document.getElementById("wash"), wr=wash.getBoundingClientRect();
  const ctr=id=>{const r=document.getElementById(id).getBoundingClientRect();
    return [(r.left+r.width/2-wr.left)/wr.width*100,(r.top+r.height/2-wr.top)/wr.height*100];};
  const A=ctr("nameA"), H=ctr("nameB");
  const a=TEAM[g.away.code].ink, h=TEAM[g.home.code].ink;
  wash.style.background=
    `radial-gradient(24% 80% at ${A[0]}% ${A[1]}%, ${a} 0%, transparent 70%),`+
    `radial-gradient(24% 80% at ${H[0]}% ${H[1]}%, ${h} 0%, transparent 70%)`;
}
function header(g){
  document.getElementById("logoA").src=SHOT+g.away.logo;
  document.getElementById("logoB").src=SHOT+g.home.logo;
  document.getElementById("nameA").textContent=g.away.name;
  document.getElementById("nameB").textContent=g.home.name;
  const rec=t=>`<b>SOG</b> ${t.sog} &nbsp; <b>PP</b> ${t.pp} &nbsp; <b>PIM</b> ${t.pim}`;
  document.getElementById("recA").innerHTML=rec(g.away);
  document.getElementById("recB").innerHTML=rec(g.home);
  document.getElementById("date").textContent=g.date;
  document.getElementById("status").textContent=CUR.p>=3?"Final":(CUR.p===2?"2nd Period · Live":"1st Period · Live");
  document.getElementById("divider").innerHTML=`<span>${LEAGUE}</span><span class="sep">|</span><span>${g.venue}</span>`;
  const keys=PERIOD_DEFS.slice(0,CUR.p).map(d=>d.k);
  document.getElementById("pgrid").innerHTML=
    "<tr><th></th>"+keys.map(k=>`<th>${k}</th>`).join("")+"<th>T</th></tr>"+
    [g.away,g.home].map(s=>{const line=s.line.slice(0,CUR.p);
      return `<tr><td class="lbl"><span class="chip" style="background:${TEAM[s.code].ink}"></span>${s.code}</td>`+
        line.map(v=>`<td>${v}</td>`).join("")+`<td class="tot">${sum(line)}</td></tr>`;}).join("");
  document.getElementById("sA").textContent=sum(g.away.line.slice(0,CUR.p));
  document.getElementById("sA").style.color=TEAM[g.away.code].ink;
  document.getElementById("sB").textContent=sum(g.home.line.slice(0,CUR.p));
  document.getElementById("sB").style.color=TEAM[g.home.code].ink;
  positionWash(g);
}
function goalEl(x){
  const ink=TEAM[x.team].ink, el=document.createElement("div"); el.className="goal";
  el.innerHTML=`<span class="accent" style="background:${ink}"></span>
    <span class="shot"><span class="ini">${ini(x.who)}</span></span>
    <span class="gmain"><div class="gname"><span class="no">#${x.no}</span><span class="nmt">${x.who}</span></div>
      <div class="gsub"><span class="gast">${x.a}</span>${x.tag?`<span class="gtag">${x.tag}</span>`:""}<span class="gtime">${x.t}</span></div></span>`;
  const shot=el.querySelector(".shot"), img=new Image();
  img.onload=()=>{shot.innerHTML="";shot.appendChild(img);shot.style.boxShadow=`0 0 0 2px ${ink}`;};
  img.src=shotURL(x.who);
  el.querySelector(".nmt").dataset.full=x.who;
  return el;
}
function penEl(x){
  const ink=TEAM[x.team].ink, el=document.createElement("div"); el.className="pen";
  el.innerHTML=`<span class="accent" style="background:${ink}"></span>
    <span class="pwho"><div class="pname"><span class="no">#${x.no}</span><span class="nmt">${x.who}</span></div>
      <div class="psub"><span class="pinf">${x.inf}</span><span class="ppim">${x.dur}</span><span class="ptime">${x.t}</span></div></span>`;
  el.querySelector(".nmt").dataset.full=x.who;
  return el;
}
function build(){
  const g=GAMES[CUR.g];
  header(g);
  const grid=document.getElementById("grid"); grid.innerHTML="";
  const periods=PERIOD_DEFS.slice(0,CUR.p);
  grid.style.gridTemplateColumns=`repeat(${periods.length+1}, 1fr)`;
  const scoringCols=[];
  periods.forEach(d=>{
    const col=document.createElement("div");col.className="col";col.innerHTML=`<h2>${d.label}</h2>`;
    const gs=g.goals.filter(z=>z.p===d.k);
    if(!gs.length){const e=document.createElement("div");e.className="gast";e.style.cssText="opacity:.45;text-align:center;padding:.5em 0";e.textContent="No goals yet";col.appendChild(e);}
    gs.forEach(z=>col.appendChild(goalEl(z)));
    grid.appendChild(col); scoringCols.push(col);
  });
  const pcol=document.createElement("div");pcol.className="col penalties";pcol.innerHTML=`<h2>Penalty Summary</h2>`;
  let any=false;
  periods.forEach(d=>{const ps=g.pens.filter(z=>z.p===d.k);if(!ps.length)return;any=true;
    const h=document.createElement("div");h.className="psubhd";h.textContent=d.label;pcol.appendChild(h);
    ps.forEach(z=>pcol.appendChild(penEl(z)));});
  if(!any){const e=document.createElement("div");e.className="pinf";e.style.cssText="opacity:.45;text-align:center;padding:.5em 0";e.textContent="No penalties yet";pcol.appendChild(e);}
  grid.appendChild(pcol);
  fitCols(scoringCols,33); fitCols([pcol],30);
  fitText();
  scoringCols.forEach(fillHeight); fillHeight(pcol);
}
// Fill leftover vertical space in sparse columns with row spacing (not bigger text).
function fillHeight(col){
  const rows=col.querySelectorAll(".goal, .pen"); if(!rows.length)return;
  const extra=col.clientHeight-col.scrollHeight; if(extra<=2)return;
  const add=Math.min(extra/rows.length, 30);
  rows.forEach(r=>{const p=(parseFloat(getComputedStyle(r).paddingTop)||0)+add/2;
    r.style.paddingTop=p+"px"; r.style.paddingBottom=p+"px";});
}
function fitCols(cols,max){
  if(!cols.length)return; let lo=12,hi=max,best=12;
  for(let i=0;i<18;i++){const u=(lo+hi)/2;cols.forEach(c=>c.style.fontSize=u+"px");cols[0].getBoundingClientRect();
    const fits=cols.every(c=>c.scrollHeight<=c.clientHeight+0.5); if(fits){best=u;lo=u;}else{hi=u;}}
  cols.forEach(c=>c.style.fontSize=best+"px");
}
// No ellipsis anywhere. Names: full → "F. Last" → shrink (never cut). Assists/infraction: shrink to fit.
function shrinkLine(line,target){
  if(!target)return; target.style.fontSize="";
  let fs=parseFloat(getComputedStyle(target).fontSize),g=60;
  // shrink the element until its own text fits its (flex-sized) box — no overflow under the time
  while(target.scrollWidth>target.clientWidth+0.5 && fs>8 && g-->0){ fs-=0.5; target.style.fontSize=fs+"px"; }
}
function fitText(){
  document.querySelectorAll(".gname, .pname").forEach(line=>{
    const sp=line.querySelector(".nmt"); if(!sp)return;
    sp.style.fontSize=""; sp.textContent=sp.dataset.full;
    if(line.scrollWidth>line.clientWidth) sp.textContent=nameInit(sp.dataset.full);
    let fs=parseFloat(getComputedStyle(sp).fontSize),g=60;
    while(line.scrollWidth>line.clientWidth+0.5 && fs>11 && g-->0){ fs-=0.5; sp.style.fontSize=fs+"px"; }
  });
  document.querySelectorAll(".gsub").forEach(l=>shrinkLine(l,l.querySelector(".gast")));
  document.querySelectorAll(".psub").forEach(l=>shrinkLine(l,l.querySelector(".pinf")));
}
function fitWindow(){document.getElementById("stage").style.transform="scale("+Math.min(innerWidth/1840,innerHeight/1000)+")";}
addEventListener("resize",()=>{fitWindow();build();});
document.getElementById("sim").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.g)CUR.g=b.dataset.g; if(b.dataset.p)CUR.p=+b.dataset.p;
  document.querySelectorAll('#sim button').forEach(x=>{
    if(x.dataset.g)x.classList.toggle("on",x.dataset.g===CUR.g);
    if(x.dataset.p)x.classList.toggle("on",+x.dataset.p===CUR.p);});
  build();});
document.querySelector('#sim button[data-g="low"]').classList.add("on");
document.querySelector('#sim button[data-p="3"]').classList.add("on");
build(); fitWindow();
</script>
</body>
</html>
