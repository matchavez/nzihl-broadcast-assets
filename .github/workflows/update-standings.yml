name: Update NZIHL Standings Graphic

# Runs nightly at 14:00 UTC, which is 02:00 NZST (New Zealand winter, the
# hockey season).  NZ shifts to NZDT (UTC+13) from late September to early
# April, so during the off-season this fires at 03:00 local — fine, since
# no games are being played then.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # required to commit the updated PNG back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render standings graphic
        run: python build_standings.py

      - name: Commit updated PNG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- NZIHL_Standings.png; then
            echo "No change in standings graphic — nothing to commit."
            exit 0
          fi
          git add NZIHL_Standings.png
          git commit -m "Update NZIHL standings ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
