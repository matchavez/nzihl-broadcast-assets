name: Update Standings Graphics

# Runs nightly at 14:00 UTC, which is 02:00 NZST (New Zealand winter — the
# hockey season). NZ shifts to NZDT (UTC+13) from late September to early
# April, so during the off-season this fires at 03:00 local — fine, since
# no games are being played then.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # required to commit the updated PNGs back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5      # Node 24 (since Aug 2025)

      - name: Set up Python
        uses: actions/setup-python@v6  # Node 24 (since Jan 2026)
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render standings graphics
        run: python build_standings.py

      - name: Commit updated PNGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="NZIHL_Standings.png NZWIHL_Standings.png \
            NZIHL_Standings_1840x1000.png NZWIHL_Standings_1840x1000.png"
          if git diff --quiet -- $FILES; then
            echo "No change in standings graphics — nothing to commit."
            exit 0
          fi
          git add $FILES
          git commit -m "Update NZIHL & NZWIHL standings ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
